name: Seedance 2.5 Release 2026-11-18

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    steps:
      - name: Require successful Validation for this exact main revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_SHA"
          gh api "repos/$GH_REPO/actions/workflows/validation.yml/runs?head_sha=$EXPECTED_SHA&event=push&per_page=10" > /tmp/seedance25-validation.json
          conclusion="$(node -e 'const r=require("/tmp/seedance25-validation.json");const v=r.workflow_runs.find(x=>x.head_sha===process.env.EXPECTED_SHA&&x.status==="completed");process.stdout.write(v?.conclusion||"missing")')"
          test "$conclusion" = success
      - name: Verify pinned server-side release reaches stable readiness
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          stable=0
          while (( SECONDS < deadline )); do
            if curl -fsS --max-time 15 http://drama.richbest.cn/ready -o /tmp/seedance25-ready.json &&
              node -e 'const r=require("/tmp/seedance25-ready.json");process.exit(r.revision===process.env.EXPECTED_SHA&&r.status==="ready"&&r.checks?.database&&r.checks?.frontend?0:1)'; then
              stable=$((stable + 1))
              if (( stable >= 4 )); then
                echo "Verified stable server-side release $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              stable=0
            fi
            sleep 20
          done
          echo 'Pinned release did not become healthy; this verifier does not deploy or retry.' >&2
          exit 1
