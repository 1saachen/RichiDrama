name: Preview Cleanup

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report previews eligible for cleanup
        type: boolean
        default: true

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: vars.ENABLE_PREVIEW_CLEANUP == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run repository-scoped preview cleanup
        id: cleanup
        env:
          HOST: ${{ secrets.PREVIEW_CLEANUP_HOST }}
          PORT: ${{ secrets.PREVIEW_CLEANUP_PORT }}
          CLEANUP_KEY: ${{ secrets.PREVIEW_CLEANUP_KEY }}
          HOST_KEYS: ${{ secrets.PREVIEW_CLEANUP_KNOWN_HOSTS }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$HOST" && -n "$PORT" && -n "$CLEANUP_KEY" && -n "$HOST_KEYS" ]] || {
            echo '::error::Preview cleanup connection is not configured.'; exit 1;
          }
          [[ "$PORT" =~ ^[0-9]+$ ]] && (( PORT > 0 && PORT <= 65535 ))
          key_file=$(mktemp "$RUNNER_TEMP/preview-cleanup-key.XXXXXX")
          known_hosts=$(mktemp "$RUNNER_TEMP/preview-cleanup-hosts.XXXXXX")
          trap 'rm -f -- "$key_file" "$known_hosts"' EXIT
          chmod 600 "$key_file" "$known_hosts"
          printf '%s\n' "$CLEANUP_KEY" > "$key_file"
          printf '%s\n' "$HOST_KEYS" > "$known_hosts"
          action=remove
          [[ "$DRY_RUN" == true ]] && action=report
          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            cleanup_command="$action-closed $PR_NUMBER"
          else
            cleanup_command="$action-expired"
          fi
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts" -i "$key_file" -p "$PORT" \
            "root@$HOST" "$cleanup_command"
          [[ "$action" == remove ]] && echo 'applied=true' >> "$GITHUB_OUTPUT" || true
      - name: Mark closed PR preview deployments inactive
        if: success() && github.event_name == 'pull_request_target' && steps.cleanup.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?environment=preview&sha=${SHA}" --jq '.[].id')"
          for deployment_id in $ids; do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" -f state=inactive -f auto_inactive=false >/dev/null
          done
