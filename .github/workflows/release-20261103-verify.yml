name: Scheduled Release Verification 2026-11-03

on:
  schedule:
    - cron: '35 10 3 11 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-20261103-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - name: Verify exact scheduled revision and stable readiness
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(date -u +%F)" == 2026-11-03 ]]
          start=$(date -u -d '2026-11-03 10:30:00 UTC' +%s)
          end=$(date -u -d '2026-11-03 12:00:00 UTC' +%s)
          stable=0
          while (( $(date -u +%s) < end )); do
            if (( $(date -u +%s) >= start )) && curl --fail --silent --show-error --max-time 15 http://drama.richbest.cn/ready -o /tmp/release-ready.json &&
              node -e 'const r=require("/tmp/release-ready.json");process.exit(r.revision===process.env.EXPECTED_SHA && r.status==="ready" && r.checks?.database && r.checks?.frontend ? 0 : 1)'; then
              stable=$((stable + 1))
              if (( stable >= 4 )); then
                echo "Verified stable release $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              stable=0
            fi
            sleep 30
          done
          echo 'Scheduled release did not reach the expected healthy revision before the approved window ended.' >&2
          exit 1
      - name: Disable this one-time verification schedule
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method PUT "repos/$GH_REPO/actions/workflows/release-20261103-verify.yml/disable"
